name: Publish to PyPI

# Publishing a GitHub release builds the package from the tagged commit and uploads it to PyPI.
# PyPI accepts the upload through a trusted publisher registered for this repository, this
# workflow file and the environment "pypi"; no token is stored in the repository.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/binaryfog/__init__.py)
          echo "tag $tag, pyproject.toml $version, __init__.py $init"
          test "$tag" = "$version" && test "$tag" = "$init"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test the wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          cd tests && python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/binaryfog/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
