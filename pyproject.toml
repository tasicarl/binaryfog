[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binaryfog"
version = "1.0.0"
description = "The supermassive black hole binary background as a nuisance in pulsar timing array searches for new physics"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Carlo Tasillo"},
    {name = "Torsten Bringmann"},
    {name = "Chris Gordon"},
]
maintainers = [
    {name = "Carlo Tasillo", email = "carlo.tasillo@ific.uv.es"},
]
keywords = ["pulsar timing arrays", "gravitational waves", "supermassive black hole binaries", "early universe"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.optional-dependencies]
table = ["pandas>=1.3"]
test = ["pytest>=7", "pandas>=1.3"]
# The NANOGrav model files import PTArcade themselves. It is needed only to load them, never by
# binaryfog: a model here is any callable taking frequencies and returning h^2 Omega.
models = ["ptarcade>=1.1"]

[project.urls]
Repository = "https://github.com/tasicarl/binaryfog"
Archive = "https://doi.org/10.5281/zenodo.24294394"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binaryfog = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
